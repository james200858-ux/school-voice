{% extends "base.html" %}

{% block content %}
    <a href="{{ url_for('index') }}" class="back-link">← 목록으로</a>

    <div class="detail-card">
        <span class="category">{{ opinion['category'] }}</span>
        <h1>{{ opinion['title'] }}</h1>
        <p class="content">{{ opinion['content'] }}</p>

        <button id="like-btn" class="like-btn" data-id="{{ opinion['id'] }}">
            👍 <span id="like-count">{{ opinion['likes'] }}</span>
        </button>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
