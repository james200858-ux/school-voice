{% extends "base.html" %}

{% block content %}
    <div class="page-header">
        <h1>학생 의견 목록</h1>
        <a href="{{ url_for('write') }}" class="btn">+ 의견 등록</a>
    </div>

    {% if opinions|length == 0 %}
        <p class="empty">아직 등록된 의견이 없어요.</p>
    {% else %}
        <div class="card-list">
            {% for op in opinions %}
                <a href="{{ url_for('detail', opinion_id=op['id']) }}" class="card-link">
                    <div class="card">
                        <span class="category">{{ op['category'] }}</span>
                        <h3>{{ op['title'] }}</h3>
                        <p>👍 {{ op['likes'] }}</p>
                    </div>
                </a>
            {% endfor %}
        </div>
    {% endif %}
{% endblock %}
